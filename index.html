<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Browser BG Remover</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; overflow-x: hidden; }
  .container { max-width: 100%; margin: 0 auto; padding: 12px; }
  h1 { text-align: center; margin-bottom: 12px; font-size: 1.4rem; }
  .status { text-align: center; padding: 10px; margin-bottom: 10px; border-radius: 8px; font-size: 0.9rem; }
  .status.info { background: rgba(99,102,241,0.2); color: #a5b4fc; }
  .status.success { background: rgba(34,197,94,0.2); color: #86efac; }
  .status.error { background: rgba(239,68,68,0.2); color: #fca5a5; }
  .upload-zone { border: 2px dashed #555; border-radius: 12px; padding: 24px 16px; text-align: center; cursor: pointer; margin-bottom: 12px; background: rgba(255,255,255,0.03); }
  .upload-zone:active { border-color: #6366f1; background: rgba(99,102,241,0.1); }
  .upload-zone input { position: absolute; opacity: 0; width: 0; height: 0; }
  .upload-zone p { margin: 4px 0; }
  .upload-zone .hint { font-size: 0.75rem; color: #888; }
  .preview-area { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
  .preview-box h3 { margin-bottom: 6px; font-size: 0.9rem; color: #aaa; }
  .preview-box canvas { width: 100%; border-radius: 8px; background: repeating-conic-gradient(#333 0% 25%, #444 0% 50%) 50% / 16px 16px; touch-action: none; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  button { padding: 12px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: opacity 0.2s; min-height: 44px; }
  button:active { opacity: 0.8; }
  button:disabled { opacity: 0.4; }
  .btn-primary { background: #6366f1; color: #fff; }
  .btn-success { background: #22c55e; color: #fff; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-secondary { background: #555; color: #fff; }
  .hidden { display: none !important; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .refine-panel { margin-bottom: 12px; }
  .mode-indicator { text-align: center; padding: 6px; font-size: 0.8rem; color: #aaa; }
  .mode-indicator.active { color: #f59e0b; font-weight: 600; }
  .refine-controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; margin-top: 8px; }
  .brush-size { display: flex; align-items: center; gap: 6px; }
  .brush-size input { width: 80px; }
  .canvas-wrapper { position: relative; display: inline-block; width: 100%; }
  .overlay-canvas { position: absolute; top: 0; left: 0; touch-action: none; }
</style>
</head>
<body>
<div class="container">
  <h1>🖼️ BG Remover</h1>
  
  <div id="status" class="status info">Tap to select a photo</div>
  
  <label class="upload-zone" id="upload-zone" for="file-input">
    <input type="file" id="file-input" accept="image/*">
    <p>📁 Tap to select photo</p>
    <p class="hint">Supports JPG, PNG, WebP</p>
  </label>
  
  <div class="preview-area hidden" id="preview-area">
    <div class="preview-box">
      <h3>Original</h3>
      <img id="original-img" src="" alt="Original">
    </div>
    <div class="preview-box">
      <h3>Result</h3>
      <div class="canvas-wrapper">
        <canvas id="result-canvas"></canvas>
        <canvas id="overlay-canvas" class="overlay-canvas"></canvas>
      </div>
    </div>
  </div>
  
  <div class="controls hidden" id="main-controls">
    <button class="btn-primary" id="btn-remove-bg">🪄 Remove BG</button>
    <button class="btn-secondary" id="btn-refine">✏️ Refine</button>
    <button class="btn-success" id="btn-download" disabled>⬇️ Save</button>
    <button class="btn-secondary" id="btn-reset">🔄 Reset</button>
  </div>
  
  <div id="refine-panel" class="hidden refine-panel">
    <div class="mode-indicator" id="mode-indicator">Paint Keep (green) or Erase (red)</div>
    <div class="refine-controls">
      <button class="btn-success" id="btn-keep">+ Keep</button>
      <button class="btn-danger" id="btn-erase">- Erase</button>
      <div class="brush-size">
        <input type="range" id="brush-size" min="10" max="60" value="25">
        <span id="brush-size-val">25</span>
      </div>
      <button class="btn-secondary" id="btn-undo">↩️ Undo</button>
      <button class="btn-secondary" id="btn-clear">Clear</button>
      <button class="btn-primary" id="btn-rerun">Re-run</button>
      <button class="btn-secondary" id="btn-exit">Exit</button>
    </div>
  </div>
</div>

<script type="module">
import { removeBackground } from 'https://esm.sh/@imgly/background-removal@1.4.5';

let originalImage = null;
let refineMode = false;
let brushMode = 'keep';
let brushSize = 25;
let isPainting = false;
let paintedPoints = [];
let undoStack = [];
let basePixels = null;
let originalPixels = null;
let originalWidth = 0;
let originalHeight = 0;

const $ = (sel) => document.querySelector(sel);
const status = (msg, type = 'info') => {
  const el = $('#status');
  el.textContent = msg;
  el.className = 'status ' + type;
};

const uploadZone = $('#upload-zone');
const fileInput = $('#file-input');

uploadZone.addEventListener('click', (e) => {
  if (e.target === uploadZone || e.target.tagName === 'P') {
    fileInput.click();
  }
});

fileInput.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (file) handleFile(file);
  e.target.value = '';
});

function handleFile(file) {
  if (!file) { status('No file selected', 'error'); return; }
  if (!file.type.startsWith('image/')) { status('Select an image file', 'error'); return; }
  status('Loading image...', 'info');
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    originalImage = img;
    img.onload = () => {
      // Limit size for mobile performance
      let w = img.width, h = img.height;
      const maxDim = 2048;
      if (w > maxDim || h > maxDim) {
        const scale = maxDim / Math.max(w, h);
        w = Math.round(w * scale);
        h = Math.round(h * scale);
      }
      $('#original-img').src = e.target.result;
      $('#preview-area').classList.remove('hidden');
      $('#main-controls').classList.remove('hidden');
      const canvas = $('#result-canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      originalPixels = ctx.getImageData(0, 0, w, h);
      const overlay = $('#overlay-canvas');
      overlay.width = w;
      overlay.height = h;
      status('Image loaded (' + w + 'x' + h + '). Tap "Remove BG".', 'info');
    };
    img.onerror = () => status('Failed to load image', 'error');
    img.src = e.target.result;
  };
  reader.onerror = () => status('Failed to read file', 'error');
  reader.readAsDataURL(file);
}

$('#btn-remove-bg').addEventListener('click', async () => {
  if (!originalImage) return;
  const btn = $('#btn-remove-bg');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Removing...';
  status('Removing background...', 'info');
  try {
    const blob = await removeBackground($('#original-img').src);
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const canvas = $('#result-canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      basePixels = ctx.getImageData(0, 0, img.width, img.height);
      const overlay = $('#overlay-canvas');
      overlay.width = img.width;
      overlay.height = img.height;
      $('#btn-download').disabled = false;
      status('Background removed! Tap "Refine" to touch up.', 'success');
    };
    img.src = url;
  } catch (err) {
    status('Error: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🪄 Remove BG';
  }
});

$('#btn-download').addEventListener('click', () => {
  const canvas = $('#result-canvas');
  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'bg-removed.png';
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/png');
});

$('#btn-reset').addEventListener('click', () => {
  originalImage = null;
  basePixels = null;
  originalPixels = null;
  paintedPoints = [];
  undoStack = [];
  refineMode = false;
  $('#preview-area').classList.add('hidden');
  $('#main-controls').classList.add('hidden');
  $('#refine-panel').classList.add('hidden');
  $('#original-img').src = '';
  fileInput.value = '';
  status('Tap to select a photo', 'info');
});

$('#btn-refine').addEventListener('click', () => {
  refineMode = true;
  $('#refine-panel').classList.remove('hidden');
  $('#mode-indicator').classList.add('active');
  updateModeIndicator();
  const canvas = $('#result-canvas');
  const ctx = canvas.getContext('2d');
  basePixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
  paintedPoints = [];
  undoStack = [];
  const overlay = $('#overlay-canvas');
  overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
});

$('#btn-exit').addEventListener('click', () => {
  refineMode = false;
  paintedPoints = [];
  const overlay = $('#overlay-canvas');
  overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
  $('#refine-panel').classList.add('hidden');
  $('#mode-indicator').classList.remove('active');
});

$('#btn-keep').addEventListener('click', () => { brushMode = 'keep'; updateModeIndicator(); });
$('#btn-erase').addEventListener('click', () => { brushMode = 'erase'; updateModeIndicator(); });

$('#brush-size').addEventListener('input', (e) => {
  brushSize = parseInt(e.target.value);
  $('#brush-size-val').textContent = brushSize;
});

$('#btn-undo').addEventListener('click', () => {
  if (undoStack.length === 0) { status('Nothing to undo', 'info'); return; }
  const prev = undoStack.pop();
  const canvas = $('#result-canvas');
  canvas.width = prev.width;
  canvas.height = prev.height;
  const ctx = canvas.getContext('2d');
  ctx.putImageData(prev, 0, 0);
  basePixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
  status('Undone', 'info');
});

$('#btn-clear').addEventListener('click', () => {
  paintedPoints = [];
  const overlay = $('#overlay-canvas');
  overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
  status('Cleared', 'info');
});

$('#btn-rerun').addEventListener('click', () => {
  if (paintedPoints.length === 0) { status('Paint something first', 'error'); return; }
  const canvas = $('#result-canvas');
  const ctx = canvas.getContext('2d');
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (undoStack.length > 10) undoStack.shift();
  
  // Simple approach: just apply the painted strokes directly
  // Keep = restore from original, Erase = transparent
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  for (const p of paintedPoints) {
    const idx = (p.y * canvas.width + p.x) * 4;
    if (p.label === 1) { // keep
      const oidx = (p.y * originalPixels.width + p.x) * 4;
      imageData.data[idx] = originalPixels.data[oidx];
      imageData.data[idx + 1] = originalPixels.data[oidx + 1];
      imageData.data[idx + 2] = originalPixels.data[oidx + 2];
      imageData.data[idx + 3] = originalPixels.data[oidx + 3];
    } else { // erase
      imageData.data[idx + 3] = 0;
    }
  }
  ctx.putImageData(imageData, 0, 0);
  basePixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
  
  const overlay = $('#overlay-canvas');
  overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
  paintedPoints = [];
  status('Applied! Paint more or download.', 'success');
});

function updateModeIndicator() {
  const el = $('#mode-indicator');
  el.textContent = brushMode === 'keep' ? '🟢 Keep — paint to restore' : '🔴 Erase — paint to remove';
}

// ---- Brush Painting ----
const overlay = $('#overlay-canvas');
let isPainting = false;

function getCoords(e) {
  const rect = overlay.getBoundingClientRect();
  const scaleX = overlay.width / rect.width;
  const scaleY = overlay.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function paintAt(x, y) {
  const ctx = overlay.getContext('2d');
  const r = brushSize;
  ctx.fillStyle = brushMode === 'keep' ? 'rgba(34,197,94,0.5)' : 'rgba(239,68,68,0.5)';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  
  for (let dy = -r; dy <= r; dy += 3) {
    for (let dx = -r; dx <= r; dx += 3) {
      if (dx*dx + dy*dy > r*r) continue;
      const px = Math.round(x + dx);
      const py = Math.round(y + dy);
      if (px < 0 || py < 0 || px >= overlay.width || py >= overlay.height) continue;
      const exists = paintedPoints.some(p => Math.abs(p.x-px) < 2 && Math.abs(p.y-py) < 2);
      if (!exists) paintedPoints.push({ x: px, y: py, label: brushMode === 'keep' ? 1 : 0 });
    }
  }
}

overlay.addEventListener('touchstart', (e) => {
  if (!refineMode) return;
  e.preventDefault();
  isPainting = true;
  const { x, y } = getCoords(e);
  paintAt(x, y);
}, { passive: false });

overlay.addEventListener('touchmove', (e) => {
  if (!refineMode || !isPainting) return;
  e.preventDefault();
  const { x, y } = getCoords(e);
  paintAt(x, y);
}, { passive: false });

overlay.addEventListener('touchend', () => { isPainting = false; });

overlay.addEventListener('mousedown', (e) => {
  if (!refineMode) return;
  isPainting = true;
  const { x, y } = getCoords(e);
  paintAt(x, y);
});

overlay.addEventListener('mousemove', (e) => {
  if (!refineMode || !isPainting) return;
  const { x, y } = getCoords(e);
  paintAt(x, y);
});

overlay.addEventListener('mouseup', () => { isPainting = false; });
overlay.addEventListener('mouseleave', () => { isPainting = false; });
</script>
</body>
</html>
